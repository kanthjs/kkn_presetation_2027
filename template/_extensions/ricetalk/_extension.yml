title: ricetalk
author: Kanthanawit Jaisong
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, ricetalk.scss]
      width: 1600
      height: 900
      margin: 0.06
      slide-number: c/t
      hash-type: number
      transition: fade
      highlight-style: github
      code-copy: true
      preview-links: auto
      title-slide-attributes:
        data-background-color: "#1F4E2C"
